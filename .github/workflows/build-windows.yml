name: Build Windows EXE
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S game -B build -A x64
      - run: cmake --build build --config Release
      - name: Download photoreal CC0 textures (Poly Haven)
        run: python game/tools/fetch_assets.py build/Release/assets
        continue-on-error: true
      - name: Copy 3D models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/Release/models | Out-Null
          Copy-Item game/models/* build/Release/models/ -Recurse -Exclude *.md
          pip install numpy
          python game/tools/fetch_models.py build/Release/models/polyhaven
          python game/tools/kit_manifest.py (Get-ChildItem build/Release/models/polyhaven/modular_*facade/*.gltf).FullName
          Get-ChildItem build/Release/models/*.glb | ForEach-Object { python game/tools/fix_skin.py $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: NeonCoast-Windows
          path: |
            build/Release/NeonCoast.exe
            build/Release/assets/
            build/Release/models/
